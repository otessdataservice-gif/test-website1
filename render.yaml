# Optional Render blueprint: one web service that serves both the API and the
# built React app. You can also create the service by hand with the settings in
# README.md.
#
# MONGODB_URI is sync:false so Render asks for it instead of storing it here.

services:
  - type: web
    name: taskflow
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
